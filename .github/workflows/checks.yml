name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twinverse/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: twinverse/backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run lint
      - run: npm test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twinverse/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: twinverse/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:integration
      - run: npm run build
